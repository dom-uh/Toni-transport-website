<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        form {
            display: flex;
            flex-direction: column;
            max-width: 500px;
        }
        label {
            margin-top: 20px;
        }
        select, input, textarea {
            margin-top: 5px;
            padding: 10px;
            font-size: 1em;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Select Your Laptops</h2>
    <form id="laptopForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="items">Select Laptops (Hold Ctrl or Cmd to select multiple):</label>
        <select id="items" name="items" multiple required>
            <option value="Laptop A">Laptop A</option>
            <option value="Laptop B">Laptop B</option>
            <option value="Laptop C">Laptop C</option>
            <option value="Laptop D">Laptop D</option>
            <option value="Laptop E">Laptop E</option>
        </select>

        <label for="info">Additional Information:</label>
        <textarea id="info" name="info" rows="4"></textarea>

        <button type="submit">Book via WhatsApp</button>
    </form>

    <script>
        const form = document.getElementById('laptopForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const info = document.getElementById('info').value;

            const itemsSelect = document.getElementById('items');
            const selectedItems = Array.from(itemsSelect.selectedOptions).map(option => option.value);
            const itemsText = selectedItems.join(', ');

            const message = `Hello, I would like to book the following laptops: ${itemsText}. My name is ${name}, my phone number is ${phone}, and my email is ${email}. Additional info: ${info}`;

            const whatsappURL = `https://wa.me/1234567890?text=${encodeURIComponent(message)}`;

            window.open(whatsappURL, '_blank');
        });
    </script>
</body>
</html>
